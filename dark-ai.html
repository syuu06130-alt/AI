<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dark-AI - Universal AI Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(20, 20, 40, 0.95);
            border-right: 1px solid rgba(138, 43, 226, 0.3);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .logo {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(138, 43, 226, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #8a2be2 0%, #4b0082 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
        }

        .logo-text h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #8a2be2, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text p {
            font-size: 0.75rem;
            color: #888;
        }

        /* AI Provider Selection */
        .ai-selector {
            padding: 20px;
            border-bottom: 1px solid rgba(138, 43, 226, 0.3);
        }

        .ai-selector h3 {
            color: #8a2be2;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .ai-provider {
            padding: 12px;
            background: rgba(138, 43, 226, 0.1);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ai-provider:hover {
            background: rgba(138, 43, 226, 0.2);
            transform: translateX(5px);
        }

        .ai-provider.active {
            background: rgba(138, 43, 226, 0.3);
            border-color: #8a2be2;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.3);
        }

        .ai-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
        }

        .ai-status.inactive {
            background: #888;
        }

        /* Mode Selector */
        .mode-selector {
            padding: 20px;
            border-bottom: 1px solid rgba(138, 43, 226, 0.3);
        }

        .mode-selector h3 {
            color: #8a2be2;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .mode-btn {
            width: 100%;
            padding: 12px;
            background: rgba(138, 43, 226, 0.1);
            border: 1px solid rgba(138, 43, 226, 0.3);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 8px;
            text-align: left;
            font-size: 0.9rem;
        }

        .mode-btn:hover {
            background: rgba(138, 43, 226, 0.2);
        }

        .mode-btn.active {
            background: rgba(138, 43, 226, 0.3);
            border-color: #8a2be2;
        }

        /* Settings */
        .settings {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .settings h3 {
            color: #8a2be2;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .setting-btn {
            width: 100%;
            padding: 12px;
            background: rgba(138, 43, 226, 0.1);
            border: 1px solid rgba(138, 43, 226, 0.3);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 8px;
            text-align: left;
            font-size: 0.9rem;
        }

        .setting-btn:hover {
            background: rgba(138, 43, 226, 0.2);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            padding: 20px 30px;
            background: rgba(20, 20, 40, 0.95);
            border-bottom: 1px solid rgba(138, 43, 226, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .thinking-mode {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(138, 43, 226, 0.2);
            border: 1px solid rgba(138, 43, 226, 0.5);
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .thinking-icon {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .top-bar-right {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            padding: 10px;
            background: rgba(138, 43, 226, 0.2);
            border: 1px solid rgba(138, 43, 226, 0.3);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            background: rgba(138, 43, 226, 0.3);
            transform: translateY(-2px);
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 20px;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #8a2be2 0%, #4b0082 100%);
        }

        .message-content {
            max-width: 70%;
            background: rgba(138, 43, 226, 0.1);
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid rgba(138, 43, 226, 0.3);
        }

        .message.user .message-content {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.3);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #888;
        }

        .thinking-process {
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid rgba(255, 165, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: #ffa500;
        }

        .thinking-process summary {
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .canvas-preview {
            margin-top: 12px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }

        .canvas-preview img {
            width: 100%;
            display: block;
        }

        .image-preview {
            margin-top: 12px;
            max-width: 100%;
            border-radius: 8px;
        }

        /* Input Area */
        .input-area {
            padding: 20px 30px;
            background: rgba(20, 20, 40, 0.95);
            border-top: 1px solid rgba(138, 43, 226, 0.3);
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-tools {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tool-btn {
            padding: 8px 16px;
            background: rgba(138, 43, 226, 0.2);
            border: 1px solid rgba(138, 43, 226, 0.3);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn:hover {
            background: rgba(138, 43, 226, 0.3);
        }

        .input-box {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .textarea-wrapper {
            flex: 1;
            position: relative;
        }

        textarea {
            width: 100%;
            min-height: 60px;
            max-height: 200px;
            padding: 14px 18px;
            background: rgba(138, 43, 226, 0.1);
            border: 2px solid rgba(138, 43, 226, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            resize: vertical;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: #8a2be2;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
        }

        textarea::placeholder {
            color: #666;
        }

        .send-btn {
            padding: 14px 24px;
            background: linear-gradient(135deg, #8a2be2 0%, #4b0082 100%);
            border: none;
            color: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            height: 50px;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.5);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border: 1px solid rgba(138, 43, 226, 0.5);
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #8a2be2;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .api-input {
            width: 100%;
            padding: 12px;
            background: rgba(138, 43, 226, 0.1);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 8px;
            color: white;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .api-input:focus {
            outline: none;
            border-color: #8a2be2;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #8a2be2 0%, #4b0082 100%);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.5);
        }

        /* File upload preview */
        .file-preview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .file-item {
            position: relative;
            padding: 8px 12px;
            background: rgba(138, 43, 226, 0.2);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remove-file {
            cursor: pointer;
            color: #ff4444;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 16px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #8a2be2;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(138, 43, 226, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(138, 43, 226, 0.8);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h2 {
            color: #8a2be2;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">🌑</div>
                <div class="logo-text">
                    <h1>dark-AI</h1>
                    <p>Universal Interface</p>
                </div>
            </div>

            <div class="ai-selector">
                <h3>AI Provider</h3>
                <div class="ai-provider active" data-provider="claude">
                    <span>Claude AI</span>
                    <div class="ai-status"></div>
                </div>
                <div class="ai-provider" data-provider="gpt">
                    <span>ChatGPT</span>
                    <div class="ai-status inactive"></div>
                </div>
                <div class="ai-provider" data-provider="grok">
                    <span>Grok AI</span>
                    <div class="ai-status inactive"></div>
                </div>
                <div class="ai-provider" data-provider="gemini">
                    <span>Gemini</span>
                    <div class="ai-status inactive"></div>
                </div>
                <div class="ai-provider" data-provider="deepseek">
                    <span>DeepSeek</span>
                    <div class="ai-status inactive"></div>
                </div>
            </div>

            <div class="mode-selector">
                <h3>Mode</h3>
                <button class="mode-btn active" data-mode="fast">⚡ 高速モード</button>
                <button class="mode-btn" data-mode="pro">🎯 Proモード</button>
                <button class="mode-btn" data-mode="deep">🧠 深い思考モード</button>
            </div>

            <div class="settings">
                <h3>Settings</h3>
                <button class="setting-btn" onclick="openApiSettings()">🔑 API設定</button>
                <button class="setting-btn" onclick="clearChat()">🗑️ チャットクリア</button>
                <button class="setting-btn" onclick="exportChat()">💾 チャット保存</button>
                <button class="setting-btn" onclick="downloadHTML()">📦 HTMLダウンロード</button>
                <button class="setting-btn" onclick="downloadZIP()">📦 ZIPダウンロード</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="top-bar">
                <div class="top-bar-left">
                    <div class="thinking-mode" style="display: none;">
                        <span class="thinking-icon">🧠</span>
                        <span>思考中...</span>
                    </div>
                </div>
                <div class="top-bar-right">
                    <button class="icon-btn" onclick="toggleCanvas()" title="Canvas">🎨</button>
                    <button class="icon-btn" onclick="generateImage()" title="画像生成">🖼️</button>
                </div>
            </div>

            <div class="chat-container" id="chatContainer">
                <div class="empty-state">
                    <h2>dark-AIへようこそ</h2>
                    <p>複数のAIプロバイダーを使用できます</p>
                    <p>まずはAPI設定を行ってください</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <div class="file-preview" id="filePreview"></div>
                    <div class="input-tools">
                        <button class="tool-btn" onclick="document.getElementById('fileInput').click()">
                            📎 ファイル添付
                        </button>
                        <button class="tool-btn" onclick="document.getElementById('imageInput').click()">
                            🖼️ 画像添付
                        </button>
                        <input type="file" id="fileInput" style="display: none" multiple onchange="handleFileSelect(event)">
                        <input type="file" id="imageInput" style="display: none" accept="image/*" multiple onchange="handleImageSelect(event)">
                    </div>
                    <div class="input-box">
                        <div class="textarea-wrapper">
                            <textarea 
                                id="userInput" 
                                placeholder="メッセージを入力... (Shift+Enterで改行)"
                                onkeydown="handleKeyDown(event)"
                            ></textarea>
                        </div>
                        <button class="send-btn" onclick="sendMessage()">送信</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- API Settings Modal -->
    <div class="modal" id="apiModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>API設定</h2>
                <button class="close-btn" onclick="closeApiSettings()">×</button>
            </div>
            <div>
                <h3 style="color: #8a2be2; margin-bottom: 15px;">Claude AI</h3>
                <input type="password" class="api-input" id="claudeApi" placeholder="Claude API Key">
                
                <h3 style="color: #8a2be2; margin: 20px 0 15px;">ChatGPT</h3>
                <input type="password" class="api-input" id="gptApi" placeholder="OpenAI API Key">
                
                <h3 style="color: #8a2be2; margin: 20px 0 15px;">Grok AI</h3>
                <input type="password" class="api-input" id="grokApi" placeholder="Grok API Key">
                
                <h3 style="color: #8a2be2; margin: 20px 0 15px;">Gemini</h3>
                <input type="password" class="api-input" id="geminiApi" placeholder="Gemini API Key">
                
                <h3 style="color: #8a2be2; margin: 20px 0 15px;">DeepSeek</h3>
                <input type="password" class="api-input" id="deepseekApi" placeholder="DeepSeek API Key">
                
                <h3 style="color: #8a2be2; margin: 20px 0 15px;">画像生成 (DALL-E)</h3>
                <input type="password" class="api-input" id="dalleApi" placeholder="DALL-E API Key (OpenAI)">
                
                <button class="save-btn" onclick="saveApiSettings()">保存</button>
            </div>
        </div>
    </div>

    <script>
        let messages = [];
        let currentProvider = 'claude';
        let currentMode = 'fast';
        let attachedFiles = [];
        let apiKeys = {};

        // Load API keys from localStorage
        function loadApiKeys() {
            const saved = localStorage.getItem('darkAI_apiKeys');
            if (saved) {
                apiKeys = JSON.parse(saved);
                document.getElementById('claudeApi').value = apiKeys.claude || '';
                document.getElementById('gptApi').value = apiKeys.gpt || '';
                document.getElementById('grokApi').value = apiKeys.grok || '';
                document.getElementById('geminiApi').value = apiKeys.gemini || '';
                document.getElementById('deepseekApi').value = apiKeys.deepseek || '';
                document.getElementById('dalleApi').value = apiKeys.dalle || '';
                updateProviderStatus();
            }
        }

        // Save API keys
        function saveApiSettings() {
            apiKeys = {
                claude: document.getElementById('claudeApi').value,
                gpt: document.getElementById('gptApi').value,
                grok: document.getElementById('grokApi').value,
                gemini: document.getElementById('geminiApi').value,
                deepseek: document.getElementById('deepseekApi').value,
                dalle: document.getElementById('dalleApi').value
            };
            localStorage.setItem('darkAI_apiKeys', JSON.stringify(apiKeys));
            updateProviderStatus();
            closeApiSettings();
            alert('API設定を保存しました');
        }

        // Update provider status indicators
        function updateProviderStatus() {
            document.querySelectorAll('.ai-provider').forEach(provider => {
                const providerType = provider.getAttribute('data-provider');
                const status = provider.querySelector('.ai-status');
                if (apiKeys[providerType]) {
                    status.classList.remove('inactive');
                } else {
                    status.classList.add('inactive');
                }
            });
        }

        // AI Provider selection
        document.querySelectorAll('.ai-provider').forEach(provider => {
            provider.addEventListener('click', function() {
                const providerType = this.getAttribute('data-provider');
                if (!apiKeys[providerType]) {
                    alert(`${this.textContent}のAPIキーが設定されていません`);
                    openApiSettings();
                    return;
                }
                document.querySelectorAll('.ai-provider').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                currentProvider = providerType;
            });
        });

        // Mode selection
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentMode = this.getAttribute('data-mode');
            });
        });

        // Handle file selection
        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                attachedFiles.push({
                    type: 'file',
                    name: file.name,
                    file: file
                });
            });
            updateFilePreview();
        }

        // Handle image selection
        function handleImageSelect(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    attachedFiles.push({
                        type: 'image',
                        name: file.name,
                        data: e.target.result
                    });
                    updateFilePreview();
                };
                reader.readAsDataURL(file);
            });
        }

        // Update file preview
        function updateFilePreview() {
            const preview = document.getElementById('filePreview');
            preview.innerHTML = '';
            attachedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <span>${file.type === 'image' ? '🖼️' : '📄'} ${file.name}</span>
                    <span class="remove-file" onclick="removeFile(${index})">×</span>
                `;
                preview.appendChild(item);
            });
        }

        // Remove file
        function removeFile(index) {
            attachedFiles.splice(index, 1);
            updateFilePreview();
        }

        // Handle keyboard input
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            
            if (!text && attachedFiles.length === 0) return;
            
            if (!apiKeys[currentProvider]) {
                alert('APIキーが設定されていません');
                openApiSettings();
                return;
            }

            // Clear empty state
            const chatContainer = document.getElementById('chatContainer');
            const emptyState = chatContainer.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            // Add user message
            const userMessage = {
                role: 'user',
                content: text,
                files: [...attachedFiles],
                timestamp: new Date().toLocaleTimeString()
            };
            messages.push(userMessage);
            displayMessage(userMessage);

            // Clear input
            input.value = '';
            attachedFiles = [];
            updateFilePreview();

            // Show typing indicator
            showTypingIndicator();

            // Show thinking mode if deep thinking
            if (currentMode === 'deep') {
                document.querySelector('.thinking-mode').style.display = 'flex';
            }

            try {
                // Call appropriate AI
                let response;
                switch(currentProvider) {
                    case 'claude':
                        response = await callClaudeAPI(text);
                        break;
                    case 'gpt':
                        response = await callGPTAPI(text);
                        break;
                    case 'grok':
                        response = await callGrokAPI(text);
                        break;
                    case 'gemini':
                        response = await callGeminiAPI(text);
                        break;
                    case 'deepseek':
                        response = await callDeepSeekAPI(text);
                        break;
                }

                hideTypingIndicator();
                document.querySelector('.thinking-mode').style.display = 'none';

                const aiMessage = {
                    role: 'assistant',
                    content: response.content,
                    thinking: response.thinking,
                    timestamp: new Date().toLocaleTimeString()
                };
                messages.push(aiMessage);
                displayMessage(aiMessage);

            } catch (error) {
                hideTypingIndicator();
                document.querySelector('.thinking-mode').style.display = 'none';
                alert('エラーが発生しました: ' + error.message);
            }
        }

        // Call Claude API
        async function callClaudeAPI(text) {
            const response = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-api-key": apiKeys.claude,
                    "anthropic-version": "2023-06-01"
                },
                body: JSON.stringify({
                    model: currentMode === 'pro' ? "claude-opus-4-20250514" : "claude-sonnet-4-20250514",
                    max_tokens: currentMode === 'fast' ? 1000 : 4000,
                    messages: [{
                        role: "user",
                        content: currentMode === 'deep' 
                            ? `以下の質問について、深く思考してから答えてください。思考過程も含めて回答してください:\n\n${text}`
                            : text
                    }]
                })
            });

            const data = await response.json();
            const content = data.content.find(c => c.type === 'text')?.text || '応答を取得できませんでした';
            
            return {
                content: content,
                thinking: currentMode === 'deep' ? '深い分析を実行しました' : null
            };
        }

        // Call GPT API
        async function callGPTAPI(text) {
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKeys.gpt}`
                },
                body: JSON.stringify({
                    model: currentMode === 'pro' ? "gpt-4" : "gpt-3.5-turbo",
                    messages: [{
                        role: "user",
                        content: currentMode === 'deep'
                            ? `Think deeply about this and provide a detailed analysis:\n\n${text}`
                            : text
                    }],
                    max_tokens: currentMode === 'fast' ? 500 : 2000
                })
            });

            const data = await response.json();
            return {
                content: data.choices[0].message.content,
                thinking: currentMode === 'deep' ? 'GPT深層分析完了' : null
            };
        }

        // Call Grok API (X.AI)
        async function callGrokAPI(text) {
            // Note: Grok API endpoint may vary
            const response = await fetch("https://api.x.ai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKeys.grok}`
                },
                body: JSON.stringify({
                    messages: [{
                        role: "user",
                        content: text
                    }],
                    model: "grok-beta",
                    stream: false
                })
            });

            const data = await response.json();
            return {
                content: data.choices[0].message.content,
                thinking: currentMode === 'deep' ? 'Grok分析完了' : null
            };
        }

        // Call Gemini API
        async function callGeminiAPI(text) {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKeys.gemini}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: currentMode === 'deep'
                                ? `Analyze this deeply and provide comprehensive insights:\n\n${text}`
                                : text
                        }]
                    }]
                })
            });

            const data = await response.json();
            return {
                content: data.candidates[0].content.parts[0].text,
                thinking: currentMode === 'deep' ? 'Gemini深層分析完了' : null
            };
        }

        // Call DeepSeek API
        async function callDeepSeekAPI(text) {
            const response = await fetch("https://api.deepseek.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKeys.deepseek}`
                },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [{
                        role: "user",
                        content: text
                    }]
                })
            });

            const data = await response.json();
            return {
                content: data.choices[0].message.content,
                thinking: currentMode === 'deep' ? 'DeepSeek分析完了' : null
            };
        }

        // Display message
        function displayMessage(message) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${message.role}`;
            
            let html = `
                <div class="message-avatar">${message.role === 'user' ? '👤' : '🌑'}</div>
                <div class="message-content">
                    <div class="message-header">
                        <span>${message.role === 'user' ? 'あなた' : 'dark-AI'}</span>
                        <span>${message.timestamp}</span>
                    </div>
            `;

            if (message.thinking && currentMode === 'deep') {
                html += `
                    <details class="thinking-process">
                        <summary>💭 思考過程</summary>
                        <p>${message.thinking}</p>
                    </details>
                `;
            }

            html += `<div>${message.content.replace(/\n/g, '<br>')}</div>`;

            // Display attached files
            if (message.files && message.files.length > 0) {
                message.files.forEach(file => {
                    if (file.type === 'image') {
                        html += `<img src="${file.data}" class="image-preview" alt="${file.name}">`;
                    }
                });
            }

            html += `</div>`;
            messageDiv.innerHTML = html;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Typing indicator
        function showTypingIndicator() {
            const chatContainer = document.getElementById('chatContainer');
            const indicator = document.createElement('div');
            indicator.className = 'message assistant';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `
                <div class="message-avatar">🌑</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            chatContainer.appendChild(indicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        // Canvas functionality
        function toggleCanvas() {
            alert('Canvas機能を準備中...\n\n実装予定:\n- HTMLキャンバス\n- コード生成\n- ビジュアルエディタ');
        }

        // Image generation
        async function generateImage() {
            const prompt = window.prompt('生成したい画像の説明を入力してください:');
            if (!prompt) return;

            if (!apiKeys.dalle) {
                alert('DALL-E APIキーが設定されていません');
                openApiSettings();
                return;
            }

            try {
                const response = await fetch("https://api.openai.com/v1/images/generations", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKeys.dalle}`
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        n: 1,
                        size: "1024x1024"
                    })
                });

                const data = await response.json();
                const imageUrl = data.data[0].url;

                const aiMessage = {
                    role: 'assistant',
                    content: `画像を生成しました: "${prompt}"`,
                    files: [{
                        type: 'image',
                        data: imageUrl,
                        name: 'generated_image.png'
                    }],
                    timestamp: new Date().toLocaleTimeString()
                };
                messages.push(aiMessage);
                displayMessage(aiMessage);

            } catch (error) {
                alert('画像生成エラー: ' + error.message);
            }
        }

        // Modal functions
        function openApiSettings() {
            document.getElementById('apiModal').classList.add('active');
        }

        function closeApiSettings() {
            document.getElementById('apiModal').classList.remove('active');
        }

        // Clear chat
        function clearChat() {
            if (confirm('チャット履歴を削除しますか？')) {
                messages = [];
                document.getElementById('chatContainer').innerHTML = `
                    <div class="empty-state">
                        <h2>dark-AIへようこそ</h2>
                        <p>新しい会話を始めましょう</p>
                    </div>
                `;
            }
        }

        // Export chat
        function exportChat() {
            const chatText = messages.map(m => 
                `[${m.timestamp}] ${m.role === 'user' ? 'あなた' : 'dark-AI'}: ${m.content}`
            ).join('\n\n');
            
            const blob = new Blob([chatText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dark-ai-chat-${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Download HTML
        function downloadHTML() {
            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'dark-ai.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Download ZIP (using JSZip library would be needed for real implementation)
        async function downloadZIP() {
            alert('ZIP作成機能\n\n実装には外部ライブラリ(JSZip)が必要です。\n現在はHTMLダウンロードをご利用ください。');
        }

        // Initialize
        loadApiKeys();
    </script>
